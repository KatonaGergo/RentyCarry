<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentyCarry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>RentyCarry</h1>
      <p>Simple car renting platform</p>
    </header>

    <section>
      <h2>Available Cars</h2>
      <div id="carGrid" class="car-grid"></div>
      <p id="status" class="status"></p>
    </section>
  </main>

  <script>
    const carGrid = document.getElementById("carGrid");
    const status = document.getElementById("status");

    function renderCars(cars) {
      if (!cars.length) {
        status.textContent = "No cars found in database.";
        return;
      }

      const cards = cars.map((car) => `
        <article class="car-card">
          <img src="${car.image_url}" alt="${car.brand} ${car.model}" loading="lazy">
          <div class="car-info">
            <h3>${car.brand} ${car.model}</h3>
            <p>${car.year} - ${car.fuel_type} - ${car.seats} seats</p>
            <strong>$${Number(car.price_per_day).toFixed(0)}/day</strong>
          </div>
        </article>
      `).join("");

      carGrid.innerHTML = cards;
    }

    async function loadCars() {
      status.textContent = "Loading cars...";
      try {
        const response = await fetch("/api/cars");
        if (!response.ok) {
          throw new Error(`Request failed (${response.status})`);
        }
        const cars = await response.json();
        renderCars(cars);
        status.textContent = "";
      } catch (error) {
        status.textContent = "Could not load cars. Check server/database connection.";
        console.error(error);
      }
    }

    loadCars();
  </script>
</body>
</html>
